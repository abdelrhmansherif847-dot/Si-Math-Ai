name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.6+ is required: the Edge Function suites read TypeScript
      # directly and rely on built-in type stripping, which keeps the repo free
      # of a build step and a tsc dependency.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Runs tests/*.test.mjs and scripts/validate-*.mjs. No install step —
      # the suites are dependency-free by design (there is no package.json).
      - name: Run test suites and repo validators
        run: node tests/run-all.mjs

      # SEC-07 supply chain. The offline half of this lives in
      # repo-integrity.test.mjs (no tag may be unpinned or unhashed); this half
      # needs the network, because it re-downloads each package from the npm
      # registry, checks the tarball against the registry's own published
      # integrity, recomputes SHA-384, and fails if a committed hash has
      # drifted. That catches a hash edited by hand, a pin bumped without
      # regenerating, and a package republished under the same version.
      - name: Verify CDN pins and SRI hashes
        run: ./scripts/pin-cdn-sri.sh --check
